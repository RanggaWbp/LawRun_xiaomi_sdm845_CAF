name: Build ReBocchi (ReSukiSU + SUSFS inline hook + NoMount + Baseband-guard + Re:Kernel)

on:
  push:
    branches:
      - integ/resukisu-susfs-rebocchi
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

env:
  # Toolchain: AOSP clang is too new for this 4.9-era CAF tree (arm64 vdso asm,
  # crypto inline asm). proton-clang 13 (ProtonAOSP) is the era-matched
  # toolchain the NonGKI build guides use for 4.9 kernels.
  CLANG_SOURCE: "https://github.com/kdrag0n/proton-clang/releases/download/20211214/proton-clang-20211214.tar.xz"
  GCC_64_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"
  GCC_64_BRANCH: "android12L-release"
  GCC_32_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9"
  GCC_32_BRANCH: "android12L-release"
  AK3_SOURCE: "https://github.com/osm0sis/AnyKernel3.git"
  KERNEL_ARCH: arm64

jobs:
  build:
    name: ${{ matrix.device }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        include:
          - { device: beryllium, model: POCOPHONE F1,              kernel: ReBocchi, defconfig: beryllium_defconfig }
          - { device: dipper,    model: Mi 8,                      kernel: ReBocchi, defconfig: dipper_defconfig }
          - { device: equuleus,  model: Mi 8 Pro,                  kernel: ReBocchi, defconfig: equuleus_defconfig }
          - { device: perseus,   model: Mi MIX 3,                  kernel: ReBocchi, defconfig: perseus_defconfig }
          - { device: polaris,   model: Mi MIX 2S,                kernel: ReBocchi, defconfig: polaris_defconfig }
          - { device: ursa,      model: Mi 8 Explorer Edition,     kernel: ReBocchi, defconfig: ursa_defconfig }

    steps:
      - name: Checkout kernel source (with submodules)
        uses: actions/checkout@v4
        with:
          # ReSukiSU's Kbuild resolves its version via `git describe` inside the
          # submodule; it falls back to a hardcoded string when tags are absent.
          fetch-depth: 0
          submodules: recursive

      - name: Restore ReSukiSU submodule tags
        run: git -C KernelSU fetch --tags --depth 1 origin "refs/tags/v4.2.0-rc3:refs/tags/v4.2.0-rc3"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache cpio curl flex \
            git libelf-dev libncurses-dev libssl-dev lld lz4 python3 unzip wget zip \
            zlib1g-dev zstd
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Set up clang
        run: |
          # kdrag0n/proton-clang is a continuously-updating *repo*, not release
          # assets. clang-13 is era-matched to this 4.9 CAF tree; llvmorg-19
          # breaks arm64 vdso asm and crypto inline asm.
          # NOTE: not added to PATH — its bundled binutils/ld is too old for
          # ubuntu-24.04's glibc (.relr.dyn). We call clang by absolute path
          # and let CROSS_COMPILE supply the aarch64 binutils.
          git clone --depth 1 https://github.com/kdrag0n/proton-clang $HOME/clang

      - name: Set up GCC (aarch64-linux-android-4.9)
        run: |
          git clone --depth=1 -b "$GCC_64_BRANCH" "$GCC_64_SOURCE" $HOME/gcc-64
          git clone --depth=1 -b "$GCC_32_BRANCH" "$GCC_32_SOURCE" $HOME/gcc-32

      - name: Prepare build
        run: |
          echo "KERNEL_NAME=ReBocchi" >> $GITHUB_ENV
          echo "MAKE_FLAGS=-j$(nproc)" >> $GITHUB_ENV

      - name: Build kernel (${{ matrix.defconfig }})
        run: |
          export ARCH=$KERNEL_ARCH
          # Only gcc-4.9 binutils on PATH; clang is invoked by absolute path
          # so its bundled (too old) ld is never picked up.
          export PATH=$HOME/gcc-64/bin:$HOME/gcc-32/bin:/usr/bin:/bin:$PATH

          # CAF sdm845: CLANG_TRIPLE must be a GNU triple (see build.config.aarch64),
          # CROSS_COMPILE supplies the aarch64-linux-android-4.9 binutils.
          make $MAKE_FLAGS \
            ARCH=$KERNEL_ARCH \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            CC=$HOME/clang/bin/clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=$HOME/gcc-64/bin/aarch64-linux-android- \
            CROSS_COMPILE_ARM32=$HOME/gcc-32/bin/arm-linux-androideabi- \
            ${{ matrix.defconfig }}

          # Sanity: kernel-side integration must resolve
          grep -q "CONFIG_KSU_SUSFS=y" .config || { echo "KSU_SUSFS missing from .config"; exit 1; }
          grep -q "CONFIG_NOMOUNT=y"   .config || { echo "NOMOUNT missing from .config"; exit 1; }
          grep -q "CONFIG_BBG=y"       .config || { echo "BBG missing from .config"; exit 1; }
          grep -q "CONFIG_REKERNEL=y"  .config || { echo "REKERNEL missing from .config"; exit 1; }

          make $MAKE_FLAGS \
            ARCH=$KERNEL_ARCH \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            CC=$HOME/clang/bin/clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=$HOME/gcc-64/bin/aarch64-linux-android- \
            CROSS_COMPILE_ARM32=$HOME/gcc-32/bin/arm-linux-androideabi- \
            2>&1 | tee build.log

          # Any build failure must abort the whole run
          grep -E "Error [0-9]+|error:|fatal error" build.log && exit 1 || true
          ls -la arch/arm64/boot/Image.gz arch/arm64/boot/dtb 2>/dev/null || true

      - name: Set release date
        id: date
        run: echo "DATE=$(TZ=Asia/Jakarta date +'%d-%m-%Y')" >> $GITHUB_OUTPUT

      - name: Package with AnyKernel3
        env:
          AK3_DEVICE: ${{ matrix.device }}
          AK3_MODEL: ${{ matrix.model }}
          AK3_KERNEL: ${{ matrix.kernel }}
        run: |
          git clone --depth=1 "$AK3_SOURCE" $HOME/AnyKernel3
          ZIP_NAME="ReSukiSU-susfs_${{ matrix.device }}-$(echo ${{ steps.date.outputs.DATE }} | tr -d '-').zip"

          # AnyKernel3 template: keep the stock installer (dump_boot/write_boot,
          # ak3-core.sh) intact and only swap in our properties block + boot vars.
          # Overwriting the whole file (as we did before) deletes the flash logic
          # — the zip installs but never actually writes the kernel.
          cp -f .github/ak3-template/anykernel.sh $HOME/AnyKernel3/anykernel.sh

          mkdir -p $HOME/AnyKernel3/tmp
          # SDM845 Xiaomi needs the appended-dtb image (Image.gz-dtb); the separate
          # Image.gz has no device tree, so flashing it leaves the kernel unchanged.
          if [ -f arch/arm64/boot/Image.gz-dtb ]; then
            cp -f arch/arm64/boot/Image.gz-dtb $HOME/AnyKernel3/Image.gz-dtb
          elif [ -f arch/arm64/boot/Image.gz ]; then
            cp -f arch/arm64/boot/Image.gz $HOME/AnyKernel3/Image.gz
          fi
          # DTB if produced
          [ -f arch/arm64/boot/dtb ] && cp -f arch/arm64/boot/dtb $HOME/AnyKernel3/ || true

          # stamp kernel.string + device names into properties()
          sed -i "s|__AK3_KERNEL_STRING__|$AK3_KERNEL (ReSukiSU-susfs) by RanggaWbp|" $HOME/AnyKernel3/anykernel.sh
          sed -i "s|__AK3_DEVICE1__|$AK3_DEVICE|" $HOME/AnyKernel3/anykernel.sh
          sed -i "s|__AK3_DEVICE2__|$AK3_MODEL|" $HOME/AnyKernel3/anykernel.sh

          cd $HOME/AnyKernel3
          zip -r9 "$GITHUB_WORKSPACE/$ZIP_NAME" . -x '*.git*' -x 'README*' || \
            7z a -tzip "$GITHUB_WORKSPACE/$ZIP_NAME" . -r -x'!.git*' '!README*'
          echo "ZIP=$ZIP_NAME" >> $GITHUB_ENV
          ls -la "$GITHUB_WORKSPACE/$ZIP_NAME"

      - name: Upload zip (inter-job transfer only)
        uses: actions/upload-artifact@v4
        with:
          name: zip-${{ matrix.device }}
          path: ${{ github.workspace }}/*.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create single GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    if: always() && needs.build.result == 'success'
    steps:
      - name: Download all zips
        uses: actions/download-artifact@v4
        with:
          pattern: zip-*
          merge-multiple: true

      - name: Set release tag
        id: date
        # Unique tag per build: date + random 4-hex suffix. A rebuild never
        # clobbers a previous release and no collision check is needed.
        run: |
          DATE=$(TZ=Asia/Jakarta date +'%d-%m-%Y')
          RAND=$(openssl rand -hex 2)
          echo "TAG=resukisu-$DATE-$RAND" >> $GITHUB_OUTPUT

      - name: Verify all 6 zips present
        run: |
          ls -la *.zip
          count=$(ls -1 *.zip | wc -l)
          if [ "$count" -ne 6 ]; then echo "Expected 6 zips, got $count"; exit 1; fi
          for d in beryllium dipper equuleus perseus polaris ursa; do
            ls ReSukiSU-susfs_${d}-*.zip >/dev/null 2>&1 || { echo "Missing zip for $d"; exit 1; }
          done
          echo "All 6 device zips present."

      - name: Create Release and upload all assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.date.outputs.TAG }}
          name: ReSukiSU-susfs ${{ steps.date.outputs.TAG }} — ReBocchi SDM845 CAF
          body: |
            ReSukiSU-susfs (SUSFS inline hook) + NoMount + Baseband-guard + Re:Kernel
            Kernel: Linux 4.9.337 (Xiaomi SDM845 CAF) — build by RanggaWbp

            Devices:
            - beryllium → POCOPHONE F1
            - dipper → Mi 8
            - equuleus → Mi 8 Pro
            - perseus → Mi MIX 3
            - polaris → Mi MIX 2S
            - ursa → Mi 8 Explorer Edition

            Install in TWRP: flash the zip for your device (AnyKernel3).
            Filename format: ReSukiSU-susfs_<device>-<DDMMYYYY>.zip
          files: |
            *.zip
          make_latest: true
